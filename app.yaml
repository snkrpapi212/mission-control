name: mission-control
region: nyc
services:
  - name: mission-control
    source_dir: /
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_CONVEX_URL
        value: "https://tidy-salamander-925.eu-west-1.convex.cloud"
      - key: NEXT_PUBLIC_OPENCLAW_GATEWAY_URL
        value: "https://openclaw-main-production-aa44.up.railway.app"
    routes:
      - path: /
    health_check:
      http_path: /api/health
      port: 3000
